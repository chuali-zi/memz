name: CVE knowledge module
on:
  push:
    paths: ['cve/**', 'db/cve_*', 'scripts/cve_*', '.github/workflows/cve.yml', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['cve/**', 'db/cve_*', 'scripts/cve_*', '.github/workflows/cve.yml', 'package.json', 'package-lock.json']
jobs:
  cve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cve_ci_only
          POSTGRES_DB: cve_test_admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cve_test_admin"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test cve/test/*.test.js
        env:
          CVE_TEST_DATABASE_URL: postgres://postgres:cve_ci_only@127.0.0.1:5432/cve_test_admin
      - run: node scripts/cve_evaluate.js
        env:
          CVE_TEST_DATABASE_URL: postgres://postgres:cve_ci_only@127.0.0.1:5432/cve_test_admin
      - run: node scripts/cve_tree_evaluate.js
        env:
          CVE_TEST_DATABASE_URL: postgres://postgres:cve_ci_only@127.0.0.1:5432/cve_test_admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cve-synthetic-evaluation-node${{ matrix.node }}
          path: |
            artifacts/cve/evaluation.json
            artifacts/cve/tree-evaluation.json
          if-no-files-found: ignore
