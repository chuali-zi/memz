name: PostgreSQL integration
on: [push, pull_request]
jobs:
  memory-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline memory benchmark preparation
        run: |
          python -m unittest discover -s benchmarks/memory/tests -p 'test_*.py' -v
          python -m py_compile benchmarks/memory/scripts/*.py benchmarks/memory/tests/*.py
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres_demo_only
          POSTGRES_DB: memz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d memz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=postgres_demo_only psql -h 127.0.0.1 -U postgres -d memz -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: npm run test:system:evidence
        env:
          SYSTEM_TEST_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-evidence
          path: artifacts/system/
          if-no-files-found: ignore
      - run: npm run eval:retrieval
        env:
          EVALUATION_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-evaluation
          path: artifacts/retrieval-report.json
          if-no-files-found: ignore
      - run: npm run eval:plans
        env:
          PLAN_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-plan-evidence
          path: artifacts/query-plans.json
          if-no-files-found: ignore
      - run: npx playwright install --with-deps chromium
      - name: Verify Chinese font availability
        run: |
          test -n "$(fc-list :lang=zh family)"
          fc-match :lang=zh
      - run: npm run test:outage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outage-evidence
          path: |
            artifacts/outage-report.json
            artifacts/outage-browser/
          if-no-files-found: error
      - run: npm run test:ui:evidence
        env:
          UI_TEST_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: artifacts/ui/
          if-no-files-found: ignore
      - name: Verify and package competition evidence
        run: npm run evidence:package
      - uses: actions/upload-artifact@v4
        with:
          name: competition-evidence
          path: artifacts/submission/
          if-no-files-found: error
