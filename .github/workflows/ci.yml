name: PostgreSQL integration
on: [push, pull_request]
jobs:
  memory-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline memory benchmark preparation
        run: |
          python -m unittest discover -s benchmarks/memory/tests -p 'test_*.py' -v
          python -m py_compile benchmarks/memory/scripts/*.py benchmarks/memory/tests/*.py
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres_demo_only
          POSTGRES_DB: memz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d memz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:product:ui
        timeout-minutes: 2
      - run: npm run test:responsive:ui
        timeout-minutes: 2
      - run: PGPASSWORD=postgres_demo_only psql -h 127.0.0.1 -U postgres -d memz -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: npm run test:system:evidence
        env:
          SYSTEM_TEST_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
          PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run test:session-recovery
        env:
          SESSION_RECOVERY_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-recovery${{ matrix.node == 24 && '-node24' || '' }}
          path: artifacts/session-recovery/
          if-no-files-found: ignore
      - run: npm run test:memory:integration
        env:
          MEMORY_TEST_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
          MEMORY_TEST_OUTPUT: artifacts/memory-adapter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-adapter-synthetic-integration${{ matrix.node == 24 && '-node24' || '' }}
          path: artifacts/memory-adapter/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-evidence${{ matrix.node == 24 && '-node24' || '' }}
          path: artifacts/system/
          if-no-files-found: ignore
      - run: npm run eval:retrieval
        env:
          EVALUATION_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-evaluation${{ matrix.node == 24 && '-node24' || '' }}
          path: artifacts/retrieval-report.json
          if-no-files-found: ignore
      - run: npm run eval:context
        env:
          CONTEXT_EVALUATION_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-optimization${{ matrix.node == 24 && '-node24' || '' }}
          path: artifacts/context-optimization.json
          if-no-files-found: error
      - run: npm run eval:plans
        env:
          PLAN_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-plan-evidence${{ matrix.node == 24 && '-node24' || '' }}
          path: artifacts/query-plans.json
          if-no-files-found: ignore
      - run: npm run eval:exact-plans
        env:
          PLAN_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-reader-sql-plans${{ matrix.node == 24 && '-node24' || '' }}
          path: artifacts/exact-reader-plans.json
          if-no-files-found: ignore
      - name: Verify Chinese font availability
        run: |
          test -n "$(fc-list :lang=zh family)"
          fc-match :lang=zh
      - run: npm run test:outage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outage-evidence${{ matrix.node == 24 && '-node24' || '' }}
          path: |
            artifacts/outage-report.json
            artifacts/outage-browser/
          if-no-files-found: error
      - run: npm run test:ui:evidence
        env:
          UI_TEST_DATABASE_URL: postgres://postgres:postgres_demo_only@127.0.0.1:5432/memz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence${{ matrix.node == 24 && '-node24' || '' }}
          path: artifacts/ui/
          if-no-files-found: ignore
      - name: Verify and package competition evidence
        run: npm run evidence:package
      - uses: actions/upload-artifact@v4
        with:
          name: competition-evidence${{ matrix.node == 24 && '-node24' || '' }}
          path: artifacts/submission/
          if-no-files-found: error
