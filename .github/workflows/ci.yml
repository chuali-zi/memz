name: PostgreSQL integration
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres_demo_only
          POSTGRES_DB: memz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d memz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=postgres_demo_only psql -h 127.0.0.1 -U postgres -d memz -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: npm test
